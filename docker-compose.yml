name: corridor-cd

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: corridor
      POSTGRES_DB: corridor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor -d corridor"]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://corridor:corridor@postgres:5432/corridor
      AVIATIONSTACK_KEY: ${AVIATIONSTACK_KEY:-}
      OPENSKY_USER: ${OPENSKY_USER:-}
      OPENSKY_PASS: ${OPENSKY_PASS:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
      OPENSKY_REQUEST_DELAY_S: ${OPENSKY_REQUEST_DELAY_S:-10}
      BACKFILL_MONTHS: ${BACKFILL_MONTHS:-12}
      TIMEZONE: ${TIMEZONE:-Africa/Brazzaville}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
