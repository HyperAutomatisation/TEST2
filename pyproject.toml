[project]
name = "corridor-cd"
version = "0.1.0"
description = "Prédiction probabiliste du fret aérien Congo vers Paris CDG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.0.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
